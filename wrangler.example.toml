# Rename to wrangler.toml after creating a D1 database and filling in database_id.
# IMPORTANT: Deploy as an assets-enabled Worker, replacing the static-only deploy configuration.
name = "cyrry-challenge-list"
main = "worker.js"
compatibility_date = "2026-10-20"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ccl-accounts"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
# Create ADMIN_TOKEN using: npx wrangler secret put ADMIN_TOKEN
# Apply schema with: npx wrangler d1 execute ccl-accounts --remote --file=schema.sql
