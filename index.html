<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Cyrry Challenge List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/auth-clean.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/clan-profile.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/bulk-tracker.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/refresh.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/contrast-fixes.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CCL</h2>
                <div class="header-quicklinks"><a href="https://discord.gg/aZpSeAEnj3" target="_blank" rel="noopener noreferrer">Join Discord</a><a href="/#/submit-record">Submit Record</a></div>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/"><span class="type-label-lg">List</span></router-link>
                <router-link class="nav__tab" to="/platformer"><span class="type-label-lg">Platformer List</span></router-link>
                <router-link class="nav__tab" to="/community"><span class="type-label-lg">Community</span></router-link>
                <router-link class="nav__tab" to="/leaderboard"><span class="type-label-lg">Leaderboard</span></router-link>
                <router-link class="nav__tab" to="/teams"><span class="type-label-lg">Teams</span></router-link>
                <router-link class="nav__tab" to="/roulette"><span class="type-label-lg">Roulette</span></router-link>
                <router-link v-if="store.role" class="nav__tab" to="/admin"><span class="type-label-lg">Admin</span></router-link>
                <router-link v-if="store.authReady && store.user" class="nav__tab" :to="'/player/' + encodeURIComponent(store.profileUsername || store.user.username)"><span class="type-label-lg">Profile</span></router-link>
                <router-link v-else-if="store.authReady" class="nav__tab" to="/account"><span class="type-label-lg">Log In / Sign Up</span></router-link>
                <div class="nav__actions">
                    <router-link to="/hub" class="nav__icon ccl-home-icon" aria-label="Main menu" title="Main menu"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg></router-link>
                    <router-link v-if="store.authReady && store.user" to="/notifications" class="nav__icon ccl-notification-bell" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span v-if="store.unreadNotifications>0" class="ccl-notification-ping" :aria-label="store.unreadNotifications+' unread notifications'"></span></router-link>
                    <button class="nav__icon" @click.prevent="store.toggleDark()" aria-label="Toggle theme">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                    </button>
                </div>
            </nav>
        </header>
        <router-view :key="$route.path" :class="{ dark: store.dark }"></router-view>
    </body>
</html>
